name: Protect Restricted Files

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  protect-restricted-files:
    runs-on: ubuntu-latest

    steps:
      - name: Validate restricted file changes
        uses: actions/github-script@v7

        with:
          script: |
            const restrictedFiles = [
              '.vscode/',
              '.rules/',
              'README.md',
              'agents-policy.json',
              'copilot-instructions.md',
              'cursor-rules.md',
              'project-block.md',
              '.github/',
              'rules/',
              'project-guard.mdc',
              '.agents/',
              'block-all.md',
              '.env.example',
              '.gitignore',
              '.firebase.json',
              'nasa-open-apis.code-workspace',
              'build/',
              'build.js',
              'dev/',
              'dev-server.js'
            ];

            function isRestricted(filename) {
              return restrictedFiles.some(path => {
                if (path.endsWith('/')) {
                  const directory = path.slice(0, -1);

                  return filename === directory ||
                    filename.startsWith(path);
                }

                return filename === path;
              });
            }

            const pullRequest = context.payload.pull_request;
            const author = pullRequest.user.login;

            const { data: files } =
              await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              });

            const changedFiles = files.flatMap(file => {
              const paths = [file.filename];

              if (file.previous_filename) {
                paths.push(file.previous_filename);
              }

              return paths;
            });

            const restrictedChanges = [
              ...new Set(changedFiles.filter(isRestricted))
            ];

            if (restrictedChanges.length === 0) {
              core.info('No restricted files changed.');
              return;
            }

            core.warning(
              `Restricted files changed: ${restrictedChanges.join(', ')}`
            );

            let permission = 'none';

            try {
              const { data: permissionData } =
                await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: author
                });

              permission = permissionData.permission;
            } catch (error) {
              core.warning(
                `Could not verify repository permission for ${author}.`
              );
            }

            if (permission !== 'admin') {
              core.setFailed(
                `BLOCKED: ${author} does not have admin permission. ` +
                `Only repository administrators may modify: ` +
                `${restrictedChanges.join(', ')}`
              );

              return;
            }

            core.info(
              `AUTHORIZED: ${author} has admin permission.`
            );
