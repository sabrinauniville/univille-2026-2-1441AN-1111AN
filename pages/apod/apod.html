<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APOD - NASA APIs</title>
  <link rel="stylesheet" href="../../styles/styles.css">
  <link rel="stylesheet" href="../../styles/components/header.css">
  <link rel="stylesheet" href="../../styles/components/footer.css">
  <link rel="stylesheet" href="./apod.css">
  <script type="module" src="./apod.js"></script>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../../index.html">NASA APIs</a>
      <nav class="site-nav" aria-label="Navegação principal">
        <a href="../../index.html">Início</a>
        <a href="./apod.html" aria-current="page">APOD</a>
        <a href="../contact/contact.html">Contato</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="page-apod">
    <h1>Foto Astronômica do Dia</h1>

    <form id="apod-form">
      <label for="start-date">Data inicial</label>
      <input type="date" id="start-date" required>

      <label for="end-date">Data final</label>
      <input type="date" id="end-date" required>

      <button type="submit">Buscar</button>
    </form>

    <p id="apod-status" aria-live="polite"></p>
    <section id="apod-result"></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>NASA Open APIs • UNIVILLE</p>
      <small>Todos os direitos reservados</small>
    </div>
  </footer>
</body>

</html>
